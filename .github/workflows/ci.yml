
name: ShopSphere CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - shopsphere
          - shopsphere-auth-service
          - shopsphere-inventory-service
          - shopsphere-product-service/shopsphere-product-service
          - shopsphere-api-gateway/shopsphere-api-gateway
          - shopsphere-service-registry/shopsphere-service-registry

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-secret-key-for-shopsphere-testing-123456789

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create service databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE shopsphere_product;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE shopsphere_auth;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE shopsphere_inventory;"
        env:
          PGPASSWORD: postgres

      - name: Build and test
        working-directory: ${{ matrix.project }}
        run: mvn --batch-mode --no-transfer-progress verify
