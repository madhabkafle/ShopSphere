
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: madhab05/shopsphere-inventory-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: shopsphere
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - port: 8084
      targetPort: 8084
